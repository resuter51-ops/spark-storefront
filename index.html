<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words &amp; Wheels</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
#storefront{position:fixed;inset:0;width:100%;height:100vh;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="storefront" title="Words and Wheels storefront"></iframe>
<script>
(function(){
  var frame=document.getElementById('storefront');

  frame.addEventListener('load',function(){
    try{
      var d=frame.contentWindow.document;

      // The Payhip blue header is now hidden via Payhip's header code
      // injection, so the storefront's own navy header stays visible.
      // Remove any expired giveaway banner left by an older published version.
      var expiredPromo=d.getElementById('salvager-launch-promo');
      if(expiredPromo) expiredPromo.remove();
    }catch(err){
      console.error("Bob\u2019s Universe cleanup failed:",err);
    }
  });

  frame.src='index-original.html?v=20260915-1';

  // Forward storefront scroll requests to the Payhip overlay when embedded there.
  window.addEventListener('message',function(e){
    if(e.data && e.data.type==='scroll-top' && e.data.source==='words-and-wheels'){
      try{window.parent.postMessage(e.data,'*');}catch(err){}
    }
  });
})();
</script>
</body>
</html>
