<!-- WORDS & WHEELS — Auto-Loader v9.1 -->
<!-- Paste this into Payhip's Custom Code area. -->
<div id="waw-loader">
  <div style="text-align:center;padding:60px 20px;font-family:Arial,sans-serif;color:#1a2a4a;">
    <h2 style="font-size:22px;margin-bottom:8px;">Words and Wheels</h2>
    <p style="color:#888;font-size:14px;">Loading…</p>
  </div>
</div>

<style id="waw-hide-chrome">
/* HIDE ALL PAYHIP CHROME — targeted selectors */
header, nav, footer,
[class*="header"], [class*="Header"],
[class*="navbar"], [class*="navigation"], [class*="Navigation"],
[class*="menu-toggle"], [class*="menuToggle"], [class*="nav-toggle"], [class*="navToggle"],
[class*="burger"], [class*="hamburger"], [class*="Hamburger"],
[class*="more-btn"], [class*="moreBtn"], [class*="more-menu"], [class*="moreMenu"],
[class*="powered"], [class*="Powered"],
[class*="store-header"], [class*="storeHeader"],
[class*="site-header"], [class*="siteHeader"],
[class*="top-bar"], [class*="topBar"],
[class*="mobile-nav"], [class*="mobileNav"],
[class*="mobile-menu"], [class*="mobileMenu"] {
  display: none !important;
}

/* Make our iframe cover the entire page */
#waw-frame {
  display: block !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  min-height: 100vh !important;
  border: 0 !important;
  z-index: 2147483647 !important;
  background: #fff !important;
}
</style>

<script>
(function() {
  // ===== STEP 1: Inject CSS =====
  var style = document.getElementById('waw-hide-chrome') || document.createElement('style');
  style.id = 'waw-hide-chrome';

  // ===== STEP 2: Create the iframe =====
  var container = document.getElementById('waw-loader');
  var frame = document.createElement('iframe');
  frame.src = 'https://resuter51-ops.github.io/spark-storefront/';
  frame.setAttribute('id', 'waw-frame');
  frame.setAttribute('scrolling', 'yes');
  frame.setAttribute('title', 'Words and Wheels');
  
  frame.addEventListener('load', function() {
    container.style.display = 'none';
    forceHideChrome();
    function resize() {
      try {
        var h = frame.contentWindow.document.body.scrollHeight;
        frame.style.height = (h + 50) + 'px';
      } catch(e) {}
    }
    resize();
    setInterval(resize, 500);
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'resize' && e.data.height) {
        frame.style.height = (e.data.height + 20) + 'px';
      }
      if (e.data && e.data.type === 'scroll-top' && e.data.source === 'words-and-wheels') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
  
  // Move iframe to be a direct child of body so CSS targeting works
  container.parentNode.replaceChild(frame, container);
  // Ensure it's on body
  if (frame.parentNode !== document.body) {
    document.body.appendChild(frame);
  }

  // ===== STEP 3: Hide Payhip chrome elements =====
  function forceHideChrome() {
    // Hide headers, navs, footers, and Payhip-specific elements
    var selectors = [
      'header', 'nav', 'footer',
      '[class*="header"]', '[class*="Header"]',
      '[class*="navbar"]', '[class*="navigation"]', '[class*="Navigation"]',
      '[class*="menu-toggle"]', '[class*="menuToggle"]',
      '[class*="nav-toggle"]', '[class*="navToggle"]',
      '[class*="burger"]', '[class*="hamburger"]', '[class*="Hamburger"]',
      '[class*="more-btn"]', '[class*="moreBtn"]',
      '[class*="powered"]', '[class*="Powered"]',
      '[class*="store-header"]', '[class*="storeHeader"]',
      '[class*="site-header"]', '[class*="siteHeader"]',
      '[class*="top-bar"]', '[class*="topBar"]',
      '[class*="mobile-nav"]', '[class*="mobileNav"]',
      '[class*="mobile-menu"]', '[class*="mobileMenu"]',
      '[class*="search-bar"]', '[class*="searchBar"]',
      '[class*="cart-btn"]', '[class*="cartBtn"]',
      '[class*="login-btn"]', '[class*="loginBtn"]',
      '[role="banner"]', '[role="navigation"]'
    ];
    
    selectors.forEach(function(sel) {
      document.querySelectorAll(sel).forEach(function(el) {
        // Don't hide our iframe or anything inside it
        if (el.id === 'waw-frame' || el.closest('#waw-frame')) return;
        el.style.setProperty('display', 'none', 'important');
      });
    });

    // Hide stray Payhip nav links by text content
    document.querySelectorAll('a, button').forEach(function(el) {
      if (el.closest('#waw-frame')) return;
      var t = (el.textContent || '').trim();
      if (['Shop', 'SHOP', 'Contact', 'CONTACT', 'PLAY GAMES', 'PHRASEBOOKS', 'HOME', 'Home', 'More', 'MORE', 'Login', 'LOGIN', 'Cart', 'CART'].indexOf(t) !== -1) {
        el.style.setProperty('display', 'none', 'important');
      }
    });

    // Hide "Powered by Payhip" text
    document.querySelectorAll('div, span, p, a').forEach(function(el) {
      if (el.closest('#waw-frame')) return;
      var t = (el.textContent || '').trim();
      if (t === 'Powered by Payhip' || t === 'Powered by Payhip.') {
        el.style.setProperty('display', 'none', 'important');
      }
    });
  }

  forceHideChrome();
  setTimeout(forceHideChrome, 100);
  setTimeout(forceHideChrome, 500);
  setTimeout(forceHideChrome, 1500);
  setTimeout(forceHideChrome, 3000);

  // Watch for DOM changes — hide new Payhip elements
  var observer = new MutationObserver(function(mutations) {
    forceHideChrome();
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
