<!-- WORDS & WHEELS — Auto-Loader v9.0 -->
<!-- Paste this into Payhip's Custom Code area. -->
<div id="waw-loader">
  <div style="text-align:center;padding:60px 20px;font-family:Arial,sans-serif;color:#1a2a4a;">
    <h2 style="font-size:22px;margin-bottom:8px;">Words and Wheels</h2>
    <p style="color:#888;font-size:14px;">Loading…</p>
  </div>
</div>

<style id="waw-hide-chrome">
/* HIDE ALL PAYHIP CHROME — only our iframe shows */
header, nav, footer,
[class*="header"], [class*="Header"],
[class*="nav-"], [class*="navbar"], [class*="navigation"],
[class*="menu"], [class*="Menu"], [class*="burger"], [class*="hamburger"], [class*="Hamburger"],
[class*="footer"], [class*="Footer"],
[class*="powered"], [class*="Powered"],
[class*="cart"], [class*="Cart"],
[class*="search"], [class*="Search"],
[class*="login"], [class*="Login"],
[class*="mobile-menu"], [class*="mobileMenu"],
[class*="menu-toggle"], [class*="menuToggle"], [class*="nav-toggle"], [class*="navToggle"],
[class*="more-btn"], [class*="moreBtn"],
[class*="store-header"], [class*="storeHeader"],
[class*="top-bar"], [class*="topBar"],
[class*="site-header"], [class*="siteHeader"] {
  display: none !important;
}

/* Hide the entire body content, then re-show only our iframe */
body > *:not(#waw-frame):not(#waw-style-reset):not(#waw-hide-chrome) {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Make our iframe fill the page */
#waw-frame {
  display: block !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  min-height: 100vh !important;
  border: 0 !important;
  z-index: 2147483647 !important;
  background: #fff !important;
}
</style>

<script>
(function() {
  // ===== STEP 1: Inject CSS to nuke all Payhip chrome =====
  var style = document.getElementById('waw-hide-chrome');
  if (!style) {
    style = document.createElement('style');
    style.id = 'waw-hide-chrome';
    style.textContent = 'header,nav,footer,[class*="header"],[class*="Header"],[class*="nav-"],[class*="navbar"],[class*="navigation"],[class*="menu"],[class*="Menu"],[class*="burger"],[class*="hamburger"],[class*="Hamburger"],[class*="footer"],[class*="Footer"],[class*="powered"],[class*="Powered"],[class*="cart"],[class*="Cart"],[class*="search"],[class*="Search"],[class*="login"],[class*="Login"],[class*="mobile-menu"],[class*="mobileMenu"],[class*="menu-toggle"],[class*="menuToggle"],[class*="nav-toggle"],[class*="navToggle"],[class*="more-btn"],[class*="moreBtn"],[class*="store-header"],[class*="storeHeader"],[class*="top-bar"],[class*="topBar"],[class*="site-header"],[class*="siteHeader"]{display:none!important}body>*:not(#waw-frame):not(#waw-hide-chrome){display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}#waw-frame{display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;min-height:100vh!important;border:0!important;z-index:2147483647!important;background:#fff!important}';
    document.head.appendChild(style);
  }

  // ===== STEP 2: Create the iframe =====
  var container = document.getElementById('waw-loader');
  var frame = document.createElement('iframe');
  frame.src = 'https://resuter51-ops.github.io/spark-storefront/';
  frame.setAttribute('id', 'waw-frame');
  frame.setAttribute('scrolling', 'yes');
  frame.setAttribute('title', 'Words and Wheels');
  
  frame.addEventListener('load', function() {
    container.style.display = 'none';
    forceHideChrome();
    function resize() {
      try {
        var h = frame.contentWindow.document.body.scrollHeight;
        frame.style.height = (h + 50) + 'px';
      } catch(e) {}
    }
    resize();
    setInterval(resize, 500);
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'resize' && e.data.height) {
        frame.style.height = (e.data.height + 20) + 'px';
      }
      if (e.data && e.data.type === 'scroll-top' && e.data.source === 'words-and-wheels') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
  
  container.parentNode.replaceChild(frame, container);

  // ===== STEP 3: Aggressively hide all Payhip elements =====
  function forceHideChrome() {
    document.body.querySelectorAll(':scope > *').forEach(function(el) {
      if (el.id === 'waw-frame' || el.id === 'waw-hide-chrome') return;
      if (el.tagName === 'SCRIPT') return;
      el.style.setProperty('display', 'none', 'important');
    });
  }

  forceHideChrome();
  setTimeout(forceHideChrome, 100);
  setTimeout(forceHideChrome, 500);
  setTimeout(forceHideChrome, 1500);
  setTimeout(forceHideChrome, 3000);

  // Watch for DOM changes
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType === 1 && node.id !== 'waw-frame' && node.id !== 'waw-hide-chrome') {
          if (node.tagName === 'SCRIPT') return;
          node.style.setProperty('display', 'none', 'important');
        }
      });
    });
  });
  observer.observe(document.body, { childList: true, subtree: false });
})();
</script>
