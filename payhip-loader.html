<!-- WORDS & WHEELS — Auto-Loader v9.2 -->
<!-- Paste this into Payhip's Custom Code area. -->
<style>
/* Hide Payhip's own chrome */
header, nav, footer,
[class*="header"], [class*="Header"],
[class*="navbar"], [class*="navigation"], [class*="Navigation"],
[class*="menu-toggle"], [class*="menuToggle"],
[class*="nav-toggle"], [class*="navToggle"],
[class*="burger"], [class*="hamburger"], [class*="Hamburger"],
[class*="more-btn"], [class*="moreBtn"],
[class*="powered"], [class*="Powered"],
[class*="store-header"], [class*="storeHeader"],
[class*="site-header"], [class*="siteHeader"],
[class*="top-bar"], [class*="topBar"],
[class*="mobile-nav"], [class*="mobileNav"],
[class*="mobile-menu"], [class*="mobileMenu"],
[role="banner"], [role="navigation"] {
  display: none !important;
}
</style>

<script>
(function() {
  // Create iframe — no dependency on a container div
  var frame = document.createElement('iframe');
  frame.src = 'https://resuter51-ops.github.io/spark-storefront/';
  frame.id = 'waw-frame';
  frame.title = 'Words and Wheels';
  frame.scrolling = 'yes';
  frame.style.cssText = 'width:100%;border:0;display:block;min-height:100vh;position:fixed;top:0;left:0;z-index:2147483647;background:#fff;';

  // Hide any "Loading…" placeholder if present
  function hideLoader() {
    document.querySelectorAll('div, p, h2').forEach(function(el) {
      if (el.closest('#waw-frame')) return;
      var t = (el.textContent || '').trim();
      if (t.indexOf('Loading') !== -1 && t.length < 50) {
        el.style.display = 'none';
      }
    });
  }

  // Hide Payhip chrome by text content
  function hidePayhipText() {
    var payhipTexts = ['Shop', 'SHOP', 'Contact', 'CONTACT', 'PLAY GAMES', 'PHRASEBOOKS', 'HOME', 'More', 'MORE', 'Login', 'LOGIN', 'Cart', 'CART', 'Powered by Payhip', 'Powered by Payhip.'];
    document.querySelectorAll('a, button, div, span, p').forEach(function(el) {
      if (el.closest('#waw-frame')) return;
      var t = (el.textContent || '').trim();
      if (payhipTexts.indexOf(t) !== -1) {
        el.style.setProperty('display', 'none', 'important');
      }
    });
    // Also hide by class pattern
    var selectors = 'header,nav,footer,[class*="header"],[class*="Header"],[class*="navbar"],[class*="navigation"],[class*="menu-toggle"],[class*="nav-toggle"],[class*="burger"],[class*="hamburger"],[class*="more-btn"],[class*="powered"],[class*="store-header"],[class*="site-header"],[class*="top-bar"],[class*="mobile-nav"],[class*="mobile-menu"],[role="banner"],[role="navigation"]';
    document.querySelectorAll(selectors).forEach(function(el) {
      if (el.closest('#waw-frame')) return;
      el.style.setProperty('display', 'none', 'important');
    });
  }

  // Append iframe to body
  document.body.appendChild(frame);
  hideLoader();
  hidePayhipText();

  frame.addEventListener('load', function() {
    hideLoader();
    hidePayhipText();
    function resize() {
      try {
        var h = frame.contentWindow.document.body.scrollHeight;
        frame.style.height = (h + 50) + 'px';
      } catch(e) {}
    }
    resize();
    setInterval(resize, 500);
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'resize' && e.data.height) {
        frame.style.height = (e.data.height + 20) + 'px';
      }
      if (e.data && e.data.type === 'scroll-top' && e.data.source === 'words-and-wheels') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });

  // Multiple passes to catch late-loading Payhip elements
  setTimeout(hidePayhipText, 100);
  setTimeout(hidePayhipText, 500);
  setTimeout(hidePayhipText, 1500);
  setTimeout(hidePayhipText, 3000);

  // Watch for new elements
  if (window.MutationObserver) {
    var observer = new MutationObserver(function() {
      hidePayhipText();
      hideLoader();
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
