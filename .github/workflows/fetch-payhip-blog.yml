name: Fetch Payhip blog diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-payhip-blog.yml'

permissions:
  contents: write

jobs:
  fetch-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Bob's Thoughts page
        run: |
          curl -L --fail --silent --show-error \
            -A "Mozilla/5.0" \
            -D payhip-blog-headers.txt \
            "https://wordsandwheels.net/blog/bob-s-thoughts" \
            -o payhip-blog-debug.html
          echo "Fetched $(wc -c < payhip-blog-debug.html) bytes"
      - name: Commit diagnostic copy
        run: |
          git config user.name "Words & Wheels Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add payhip-blog-debug.html payhip-blog-headers.txt
          git commit -m "Temporarily fetch Payhip blog for overlay repair"
          git push
