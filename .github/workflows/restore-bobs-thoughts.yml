name: "Restore Bobs Thoughts Overlay"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-bobs-thoughts.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cards
        run: python scripts/restore_bobs_thoughts.py
      - name: Verify cards
        run: |
          grep -q "Our Lives Are Like Books" index-original.html
          grep -q "The Great Breakfast Negotiations" index-original.html
          grep -q "Welcome to Wheels and Words: Life Looks Different From Where I Sit" index-original.html
      - name: Commit changes
        run: |
          git config user.name "Words & Wheels Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index-original.html
          git commit -m "Restore published Bobs Thoughts to overlay" || exit 0
          git push
