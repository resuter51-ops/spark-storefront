name: Fetch Bob's Thoughts with Payhip session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-bobs-thoughts-session.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed Payhip session and fetch public posts
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36'
          rm -f payhip-session-cookies.txt bobs-posts-session.txt
          curl -sS -A "$UA" -c payhip-session-cookies.txt 'https://wordsandwheels.net/sitemap.xml' >/dev/null || true
          curl -sS -A "$UA" -b payhip-session-cookies.txt -c payhip-session-cookies.txt 'https://wordsandwheels.net/' >/dev/null || true
          urls=(
            'https://wordsandwheels.net/blog/bob-s-thoughts/welcome-to-wheels-and-words-life-looks-different-from-where-i-sit'
            'https://wordsandwheels.net/blog/bob-s-thoughts/the-great-breakfast-negotiations'
            'https://wordsandwheels.net/blog/bob-s-thoughts/our-lives-are-like-books'
          )
          for u in "${urls[@]}"; do
            echo "===== $u =====" >> bobs-posts-session.txt
            curl -sS -L --max-time 45 -A "$UA" -e 'https://wordsandwheels.net/blog/bob-s-thoughts' -b payhip-session-cookies.txt -c payhip-session-cookies.txt -D - "$u" | head -c 180000 >> bobs-posts-session.txt || true
            echo >> bobs-posts-session.txt
            echo >> bobs-posts-session.txt
          done
      - name: Commit captured post pages
        run: |
          git config user.name "Words & Wheels Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bobs-posts-session.txt
          git commit -m "Capture public Bob's Thoughts post pages" || exit 0
          git push
